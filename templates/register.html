{% extends "base.html" %}
{% block title %}{{ t.register_heading }} — {{ t.app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-5">
        <div class="panel">
            <div class="panel-header">
                <h5 class="fw-semibold mb-0">{{ t.register_heading }}</h5>
            </div>

            <div class="p-4">
                <p class="text-muted small mb-3">{{ t.login_notice }}</p>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="full_name" class="form-label small fw-medium">{{ t.label_full_name }}</label>
                        <input type="text" class="form-control form-control-sm" id="full_name" name="full_name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-medium">{{ t.label_email }}</label>
                        <input type="email" class="form-control form-control-sm" id="email" name="email" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="department" class="form-label small fw-medium">{{ t.label_department }}</label>
                            <input type="text" class="form-control form-control-sm" id="department" name="department" required>
                        </div>

                        <div class="col-md-6">
                            <label for="role" class="form-label small fw-medium">{{ t.label_role }}</label>
                            <select class="form-select form-select-sm" id="role" name="role" required>
                                <option value="doctor" selected>{{ t.role_doctor }}</option>
                                <option value="staff">{{ t.role_staff }}</option>
                                <option value="admin">{{ t.role_admin }}</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-medium">{{ t.label_password }}</label>
                        <input type="password" class="form-control form-control-sm" id="password" name="password" minlength="6" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm w-100 py-2 fw-medium">
                        {{ t.btn_register_submit }}
                    </button>
                </form>

                <hr class="my-3">
                <div class="text-center small text-muted">
                    {{ t.have_account_prompt }}
                    <a href="{{ url_for('login') }}" class="text-decoration-none">{{ t.nav_login }}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
